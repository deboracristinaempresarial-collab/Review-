name: Build Comparador Android APK

on:
  push:
    branches:
      - comparador-android-build
    paths:
      - 'comparador-android/**'
      - '.github/workflows/build-comparador-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: comparador-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: comparador-pro-android-v4-debug
          path: comparador-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
