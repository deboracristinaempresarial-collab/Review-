name: Deploy Aruna Review to Shopify

on:
  push:
    branches:
      - main
      - aruna-review-complete
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aruna-review-shopify-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Shopify deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install app dependencies
        run: npm install

      - name: Install Shopify CLI
        run: npm install --global @shopify/cli@latest

      - name: Deploy app configuration and extensions
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: shopify app deploy --config production --allow-updates --source-control-url "$COMMIT_URL"
